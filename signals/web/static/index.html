<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Crypto Signal Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls input, .controls select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .controls button {
    background: #238636;
    border: none;
    color: white;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .controls button:hover { background: #2ea043; }
  main { padding: 16px 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
  .verdict { font-weight: 600; padding: 2px 8px; border-radius: 10px; font-size: 12px; display: inline-block; }
  .strong-buy { background: rgba(63,185,80,.2); color: var(--green); }
  .buy { background: rgba(63,185,80,.1); color: var(--green); }
  .neutral { background: rgba(139,148,158,.15); color: var(--muted); }
  .sell { background: rgba(248,81,73,.1); color: var(--red); }
  .strong-sell { background: rgba(248,81,73,.2); color: var(--red); }
  .signals { color: var(--muted); font-size: 12px; }
  .signal-line { margin-bottom: 2px; }
  .bullish { color: var(--green); }
  .bearish { color: var(--red); }
  #status { color: var(--muted); font-size: 12px; padding: 0 24px 12px; }
  .error { color: var(--red); padding: 0 24px 12px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Crypto Signal Scanner</h1>
  <div class="controls">
    <select id="exchange">
      <option value="binance">Binance</option>
      <option value="kraken">Kraken</option>
      <option value="coinbase">Coinbase</option>
      <option value="bybit">Bybit</option>
    </select>
    <input id="quote" value="USDT" size="6" title="Quote currency" />
    <select id="timeframe">
      <option value="1h">1h</option>
      <option value="4h" selected>4h</option>
      <option value="1d">1d</option>
    </select>
    <input id="topN" type="number" value="20" min="1" max="100" size="4" title="Top N by volume" />
    <button id="refresh">Scan</button>
  </div>
</header>
<div id="status">Ready.</div>
<div id="errorBox" class="error" style="display:none"></div>
<main>
  <table>
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Price</th>
        <th>Score</th>
        <th>Verdict</th>
        <th>Signals</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<script>
const verdictClass = {
  "Strong Buy": "strong-buy",
  "Buy": "buy",
  "Neutral": "neutral",
  "Sell": "sell",
  "Strong Sell": "strong-sell",
};

async function scan() {
  const exchange = document.getElementById('exchange').value;
  const quote = document.getElementById('quote').value.trim() || 'USDT';
  const timeframe = document.getElementById('timeframe').value;
  const topN = document.getElementById('topN').value || 20;
  const status = document.getElementById('status');
  const errorBox = document.getElementById('errorBox');
  const rows = document.getElementById('rows');

  errorBox.style.display = 'none';
  status.textContent = 'Scanning...';
  rows.innerHTML = '';

  const url = `/api/scan?exchange=${encodeURIComponent(exchange)}&quote=${encodeURIComponent(quote)}&timeframe=${encodeURIComponent(timeframe)}&top_n=${encodeURIComponent(topN)}`;

  try {
    const res = await fetch(url);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${res.status}`);
    }
    const data = await res.json();
    render(data);
    status.textContent = `Scanned ${data.length} symbols on ${exchange} (${timeframe}) — ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    status.textContent = 'Scan failed.';
    errorBox.style.display = 'block';
    errorBox.textContent = err.message;
  }
}

function render(results) {
  const rows = document.getElementById('rows');
  rows.innerHTML = results.map(r => {
    const cls = verdictClass[r.verdict] || 'neutral';
    const signalsHtml = r.signals.map(s => {
      const sc = s.verdict === 'bullish' ? 'bullish' : s.verdict === 'bearish' ? 'bearish' : '';
      return `<div class="signal-line"><span class="${sc}">${s.name}</span>: ${s.detail}</div>`;
    }).join('');
    return `<tr>
      <td><strong>${r.symbol}</strong></td>
      <td>${Number(r.price).toLocaleString(undefined, {maximumFractionDigits: 6})}</td>
      <td>${r.composite_score > 0 ? '+' : ''}${r.composite_score}</td>
      <td><span class="verdict ${cls}">${r.verdict}</span></td>
      <td class="signals">${signalsHtml}</td>
    </tr>`;
  }).join('');
}

document.getElementById('refresh').addEventListener('click', scan);
scan();
</script>
</body>
</html>
